<!DOCTYPE html>

<title>Создавать игры</title>
<style>
:root{--bg:#faf9f5;--card:#fff;--ln:#e8e6dc;--tx:#1f1e1d;--mt:#73726c;--ac:#c96442;--acd:#b05535;--soft:#f0eee6;--ok:#2f7d5b;--e:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--soft);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;font-weight:500;margin:0;letter-spacing:-.01em}
h2{font-size:24px}h3{font-size:18px}
svg{display:block}

/* оболочка и меню */
#shell{position:fixed;inset:0;z-index:2;background:var(--bg);display:flex;flex-direction:column;transform-origin:left center;transition:transform .5s var(--e),border-radius .5s var(--e),box-shadow .5s}
body.dr #shell{transform:translateX(min(80vw,320px)) scale(.93);border-radius:28px;overflow:hidden;box-shadow:-10px 0 40px #1f1e1d22}
#sc{position:absolute;inset:0;z-index:9;display:none}body.dr #sc{display:block}
#drawer{position:fixed;top:0;bottom:0;left:0;width:min(80vw,320px);z-index:1;display:flex;flex-direction:column;padding:max(24px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom));opacity:0;transform:translateX(-24px);transition:opacity .4s,transform .5s var(--e)}

.dn{display:flex;align-items:center;gap:16px;width:100%;border:0;background:none;padding:12px;border-radius:14px;font:500 17px inherit;font-family:inherit;cursor:pointer;text-align:left;transition:background .25s,transform .2s}
.dn:active{transform:scale(.97)}.dn.on{background:#1f1e1d12}.dn:hover{background:#1f1e1d0a}
.dh{color:var(--mt);font-size:14px;padding:24px 12px 8px}
.dfoot{margin-top:auto;display:flex;gap:12px;align-items:center}

.pill:active{transform:scale(.96)}
/* шапка */
header{flex:none;display:flex;align-items:center;gap:12px;padding:max(12px,env(safe-area-inset-top)) 16px 12px;border-bottom:1px solid var(--ln)}
.rb{width:44px;height:44px;border-radius:50%;border:1px solid var(--ln);background:var(--card);display:grid;place-items:center;cursor:pointer;flex:none;transition:transform .2s,background .2s}
.rb:active{transform:scale(.92)}.rb:hover{background:var(--soft)}
.ht{flex:1;min-width:0}.ht b{display:block;font:500 18px Georgia,serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ht small{color:var(--mt)}
.chip{border:1px solid var(--ln);background:var(--card);border-radius:22px;height:44px;padding:0 16px;display:flex;align-items:center;font-weight:600;flex:none}

.xb{height:4px;background:var(--soft);flex:none}.xb i{display:block;height:100%;background:var(--ac);width:0;transition:width .8s var(--e)}
main{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
.pg{max-width:720px;margin:0 auto;padding:16px;display:grid;gap:16px}
.pg-in>*{animation:up .55s var(--e) both}.pg-in>*:nth-child(2){animation-delay:.07s}.pg-in>*:nth-child(3){animation-delay:.14s}.pg-in>*:nth-child(4){animation-delay:.21s}

nav{flex:none;border-top:1px solid var(--ln);background:var(--card);padding:8px 0 max(8px,env(safe-area-inset-bottom))}
.bi{position:relative;display:grid;grid-template-columns:repeat(4,1fr);max-width:480px;margin:0 auto;padding:0 8px}
.ind{position:absolute;top:0;bottom:0;left:8px;width:calc((100% - 16px)/4);padding:0 4px;transition:transform .5s var(--e),opacity .3s}
.ind i{display:block;height:100%;border-radius:14px;background:var(--soft)}
.bt{position:relative;z-index:1;border:0;background:none;height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:500;color:var(--mt);cursor:pointer;transition:color .3s}
.bt svg{transition:transform .4s var(--e)}.bt.on{color:var(--ac)}.bt.on svg{transform:translateY(-1px) scale(1.12)}
/* элементы */
.card{background:var(--card);border:1px solid var(--ln);border-radius:20px;padding:20px}
.card>h3{margin-bottom:8px}
.hero p{color:var(--mt);margin:8px 0 20px}
.btn{min-height:48px;background:var(--ac);color:#fff;border:0;border-radius:14px;padding:0 24px;font:600 16px inherit;font-family:inherit;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .2s var(--e),background .2s,opacity .2s}
.btn:hover{background:var(--acd)}.btn:active{transform:scale(.96)}.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn.s{min-height:40px;padding:0 16px;font-size:14px;border-radius:12px}.btn.o{background:var(--card);color:var(--tx);border:1px solid var(--ln)}.btn.o:hover{background:var(--soft)}
.row{display:flex;gap:16px;align-items:center;padding:16px 0;border-top:1px solid var(--ln)}
h3+.row,.row.f{border-top:0}.row .t{flex:1;min-width:0}.row small{display:block;color:var(--mt);font-size:14px}
.ico{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;color:#fff;font-size:26px;flex:none;transition:background .3s}
.ico.l{width:72px;height:72px;font-size:36px;border-radius:20px}.ico.m{width:36px;height:36px;font-size:18px;border-radius:10px}
.av{width:44px;height:44px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-weight:600;color:var(--ac);flex:none}
.bar{height:8px;background:var(--soft);border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac);border-radius:8px;transition:width 1s var(--e)}
label{display:block;font-weight:600;font-size:14px;margin:24px 0 8px}
input[type=text]{width:100%;height:48px;padding:0 16px;border:1px solid var(--ln);border-radius:14px;font:16px inherit;font-family:inherit;background:#fff;color:var(--tx);transition:border-color .2s,box-shadow .2s}
input:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 3px #c9644222}
button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}@media(min-width:560px){.opts{grid-template-columns:repeat(3,1fr)}}
.opt{min-height:56px;border:1px solid var(--ln);background:var(--card);border-radius:14px;padding:8px 12px;font:500 15px inherit;font-family:inherit;cursor:pointer;text-align:left;transition:all .25s var(--e)}
.opt:active{transform:scale(.96)}.opt.on{border-color:var(--ac);background:#c964420f;box-shadow:inset 0 0 0 1px var(--ac)}
.opt:disabled{opacity:.45;cursor:not-allowed}.opt small{display:block;color:var(--mt);font-weight:400;font-size:12px}
.g8{display:grid;grid-template-columns:repeat(8,1fr);gap:8px}
.g8 .opt{min-height:44px;padding:0;text-align:center;font-size:20px}
.sw{height:36px;border-radius:10px;border:2px solid transparent;cursor:pointer;padding:0;transition:transform .25s var(--e),border-color .2s}.sw:active{transform:scale(.88)}.sw.on{border-color:var(--tx);transform:scale(1.1)}
.dim{color:var(--mt);font-size:14px}
/* окна */
.modal{position:fixed;inset:0;background:#1f1e1d66;display:flex;align-items:flex-end;justify-content:center;z-index:20}.modal.in{animation:fade .3s both}
.modal.out{animation:fadeo .25s both}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92dvh;overflow:auto;border-radius:24px 24px 0 0;padding:24px 20px max(24px,env(safe-area-inset-bottom))}
.modal.in .sheet{animation:sheet .55s var(--e) both}.modal.out .sheet{animation:sheeto .25s ease-in both}

.sh{display:flex;justify-content:space-between;align-items:center}
.foot{display:flex;gap:12px;margin-top:24px}.foot .btn{flex:1}
.tut{text-align:center;padding-top:32px}
.tut .big{width:96px;height:96px;border-radius:28px;background:var(--ac);color:#fff;display:grid;place-items:center;margin:0 auto 24px;animation:pop .7s var(--e) both}

.dots{display:flex;gap:8px;justify-content:center;margin:24px 0 0}.dots i{height:8px;width:8px;border-radius:8px;background:var(--ln);transition:all .4s var(--e)}.dots i.on{width:28px;background:var(--ac)}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--tx);color:#fff;padding:12px 20px;border-radius:14px;z-index:30;font-size:15px;max-width:92%;animation:toast 2.6s var(--e) both}
.card{transition:box-shadow .3s var(--e)}.card:hover{box-shadow:0 8px 24px #1f1e1d12}
.pg-in .row{animation:up .5s var(--e) both}.pg-in .row:nth-child(2){animation-delay:.18s}.pg-in .row:nth-child(3){animation-delay:.23s}.pg-in .row:nth-child(4){animation-delay:.28s}.pg-in .row:nth-child(5){animation-delay:.33s}.pg-in .row:nth-child(n+6){animation-delay:.38s}
.ico.l{animation:flt 3s ease-in-out infinite}.glow{animation:glow 2.4s ease-in-out infinite}
.bar i{background:linear-gradient(90deg,var(--ac),#e8957a,var(--ac));background-size:200% 100%;animation:shm 2s linear infinite}
.win{border:1px solid var(--ln);border-radius:16px;overflow:hidden;background:var(--card)}
.wb{display:flex;align-items:center;gap:8px;padding:12px 16px;background:var(--soft);border-bottom:1px solid var(--ln)}
.wb span{width:10px;height:10px;border-radius:50%;flex:none}.wb span:nth-child(1){background:#e0665a}.wb span:nth-child(2){background:#e0b04a}.wb span:nth-child(3){background:#6fb264}
.cr{margin-left:8px;font-size:13px;color:var(--mt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wbody{padding:12px}.fl{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-top:12px;max-height:44vh;overflow:auto}
.fi{display:flex;align-items:center;gap:8px;border:1px solid transparent;background:none;border-radius:12px;padding:10px;font:14px inherit;font-family:inherit;text-align:left;cursor:pointer;transition:background .2s,transform .2s}
.fi:hover{background:var(--soft)}.fi:active{transform:scale(.95)}.fi svg{color:var(--mt);flex:none}.fi.d svg{color:var(--ac)}.fi span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wl{stroke-dasharray:260;animation:dr .5s var(--e) both}.pulse rect{transform-box:fill-box;transform-origin:center;animation:pls .6s ease-in-out infinite alternate}
.shake{animation:shk .4s}.cf{position:fixed;top:-14px;width:10px;height:14px;border-radius:2px;z-index:40;animation:cf 2s ease-in forwards}
@keyframes flt{50%{transform:translateY(-5px)}}@keyframes glow{0%,100%{box-shadow:0 0 0 0 #c9644255}50%{box-shadow:0 0 0 10px #c9644200}}
@keyframes shm{to{background-position:-200% 0}}@keyframes dr{from{stroke-dashoffset:260}to{stroke-dashoffset:0}}@keyframes pls{to{transform:scale(1.25)}}

.stars{display:flex;align-items:center;gap:2px;margin:4px 0}.stars svg{animation:pop .5s var(--e) both}.stars svg:nth-child(2){animation-delay:.06s}.stars svg:nth-child(3){animation-delay:.12s}.stars svg:nth-child(4){animation-delay:.18s}.stars svg:nth-child(5){animation-delay:.24s}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.st3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}.st3 div{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:12px;text-align:center;animation:pop .6s var(--e) both}.st3 b{display:block;font:500 19px Georgia,serif}.st3 small{color:var(--mt);font-size:12px}.tag{display:inline-block;background:var(--soft);border-radius:10px;padding:2px 10px;font-size:13px;color:var(--ac);font-weight:600}

.st:not(:last-child)::before{content:"";position:absolute;left:19px;top:44px;bottom:4px;width:2px;background:var(--ln)}
.dot{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--ok);color:#fff;flex:none;position:relative;z-index:1}
.st.lk .dot{background:var(--soft);color:var(--mt)}.st.lk{opacity:.6}.st.nx .dot{animation:glow 2.4s ease-in-out infinite}
.sc{flex:1;min-width:0;border:1px solid var(--ln);border-radius:16px;padding:16px;background:var(--card)}
.sh2{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:4px}.meta{font-size:13px;color:var(--mt);margin:8px 0 12px}

.sw2{width:52px;height:30px;border-radius:15px;background:var(--ln);position:relative;border:0;cursor:pointer;transition:background .3s var(--e);flex:none}.sw2 i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .35s var(--e);box-shadow:0 1px 3px #0003}.sw2.on{background:var(--ok)}.sw2.on i{transform:translateX(22px)}

@media(hover:hover){.btn:hover{transform:translateY(-1px)}.card:hover{transform:translateY(-2px)}}.card{transition:box-shadow .3s var(--e),transform .3s var(--e)}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

</style></head><body>

function slideGame(){let a=[1,2,3,4,5,6,7,8,0],z=8;for(let i=0;i<60;i++){const n=[],r=z/3|0,c=z%3;if(r>0)n.push(z-3);if(r<2)n.push(z+3);if(c>0)n.push(z-1);if(c<2)n.push(z+1);const j=pk(n);[a[z],a[j]]=[a[j],a[z]];z=j}MG={k:"p8",a,mv:0,last:-1};slideDraw(true)}

function slideTap(i){const z=MG.a.indexOf(0);if(Math.abs((i/3|0)-(z/3|0))+Math.abs(i%3-z%3)!=1)return;MG.a[z]=MG.a[i];MG.a[i]=0;MG.mv++;MG.last=z;slideDraw();if(MG.a.every((v,k)=>v==(k+1)%9)){const m=MG.mv;setTimeout(()=>mgWin(m<=45?.5:0),700)}}
function timeGame(){const z=15+Math.random()*50|0;MG={k:"t",x:0,d:1,hit:0,err:0,sp:1.6,z:[z,z+22]};MG.iv=setInterval(()=>{const m=MG;if(!m||m.k!="t")return;m.x+=m.d*m.sp;if(m.x>=100){m.x=100;m.d=-1}if(m.x<=0){m.x=0;m.d=1}const e=$("tm");if(e)e.style.left=m.x+"%"},16);timeDraw(true)}
function timeDraw(f){mgShell(pzHead("Остановка в зоне","Нажми «Стоп», когда маркер в зелёной зоне. Нужно 3 попадания. Попаданий: "+MG.hit+" · промахов: "+MG.err)+`<div style="position:relative;height:28px;background:var(--soft);border-radius:14px;margin:32px 0;overflow:hidden"><div style="position:absolute;top:0;bottom:0;left:${MG.z[0]}%;width:22%;background:#2f7d5b44;animation:pop .4s var(--e)"></div><div id="tm" style="position:absolute;top:2px;bottom:2px;width:8px;border-radius:4px;background:var(--ac);left:${MG.x}%"></div></div><button class="btn" style="width:100%" onclick="timeStop()">Стоп</button>`,f)}
function timeStop(){const m=MG;if(!m||m.k!="t")return;if(m.x>=m.z[0]&&m.x<=m.z[1]){m.hit++;if(m.hit>=3){clearInterval(m.iv);const e=m.err;return mgWin(e<=1?.5:0)}m.sp*=1.3;const z=10+Math.random()*60|0;m.z=[z,z+22]}else m.err++;timeDraw()}
function mathGame(){MG={k:"a",i:0,err:0};mathQ(true)}
function mathQ(f){const a=2+Math.random()*10|0,b=2+Math.random()*10|0,o=pk(["+","−","×"]),r=o=="+"?a+b:o=="−"?a-b:a*b,w=new Set([r]);while(w.size<3)w.add(r+pk([-3,-2,-1,1,2,3,10,-10]));MG.t=a+" "+o+" "+b;MG.o=shuf([...w]);MG.r=r;mathDraw(f)}
function mathDraw(f){mgShell(pzHead("Быстрый счёт","Реши 5 примеров. Решено: "+MG.i+" из 5 · ошибок: "+MG.err)+`<h2 style="text-align:center;margin:24px 0;font-size:40px;animation:slin .35s var(--e) both">${MG.t} = ?</h2><div class="pz g3" style="margin-top:0">${MG.o.map(v=>`<button class="pc" onclick="mathAns(${v})">${v}</button>`).join("")}</div>`,f)}
function mathAns(v){const m=MG;if(v==m.r){m.i++;if(m.i>=5){const e=m.err;mathDraw();return setTimeout(()=>mgWin(e?0:.5),500)}mathQ()}else{m.err++;mathQ()}}

 ${d?`<div class="row f" style="padding:16px 0">${ico(d,"l")}<div class="t"><b>${d.n}</b><small>${G[d.g][0]}, ${d.o=="v"?"вертикальное":"горизонтальное"} расположение</small></div></div><div class="bar"><i id="pb" style="width:${lastP}%"></i></div><p class="dim" style="margin-bottom:20px">${d.ready?"Игра готова. Осталось опубликовать её.":"Готово на <span id=pt>"+Math.min(100,Math.round(d.p))+"</span>%. Скорость: "+speed()*4+" очков в месяц."}</p>`:`<p>Выбери жанр, название и иконку, и студия начнёт работу.</p>`}
 ${d&&d.ready?`<button class="btn glow" onclick="publish()">${d.o=="h"?"Найти игру на компьютере":"Пройти головоломку"}</button>`:`<button class="btn ${d?"":"glow"}" onclick="openW()" ${d?"disabled":""}>${svg("plus",20)}Создать игру</button>`}</div>
 <div class="card"><h3>Сообщество</h3>${S.msgs.length?S.msgs.slice(0,5).map(m=>{const g=S.games.find(x=>x.id==m.gid);return g?`<div class="row"><div class="t">Ваша игра «${esc(g.n)}» очень понравилась сообществу. Они ждут обновление.<small>${NM[m.m]} ${m.y}</small></div><button class="btn s" ${S.dev?"disabled":""} onclick="startUpd(${g.id})">Обновить</button></div>`:""}).join(""):`<p class="dim" style="margin:0">Пока тихо. Выпускай игры с высокой оценкой, и сообщество начнёт просить обновления.</p>`}</div>
 <div class="card"><h3>Отзывы игроков</h3>${S.games.length?S.games.slice(0,3).flatMap(g=>(g.rv||[]).slice(0,2).map(r=>({...r,gn:g.n}))).slice(0,4).map(r=>`<div class="row"><div class="av">${r.u[0]}</div><div class="t"><div class="stars">${stars(r.s)}</div>${r.t}<small>${r.u} · «${esc(r.gn)}»</small></div></div>`).join(""):`<p class="dim" style="margin:0">Отзывы появятся после выхода первой игры.</p>`}</div>`;;
 if(t==1)h=`<div class="card"><h3>Нанять сотрудников · ${hc()} из ${cap()}</h3>${STV().map(s=>{const c=price(s[0],s[2]),lk=S.lvl<s[3];return `<div class="row" style="${lk?"opacity:.55":""}"><div class="av">${lk?svg("lock",20):s[1][0]}</div><div class="t"><b>${s[1]}</b> · в штате ${pow(s[0])}<small>${lk?"Откроется с "+s[3]+" уровня":"Зарплата "+Math.round(s[2]/40)+" $ в месяц"}</small></div><button class="btn s" ${lk||S.money<c||hc()>=cap()?"disabled":""} onclick="hire('${s[0]}',${c})">${lk?"Закрыто":money(c)}</button></div>`}).join("")}</div>`;
 if(t==2)h=`<div class="card"><h3>Мои игры</h3>${S.games.length?S.games.map(g=>`<div class="row">${ico(g)}<div class="t"><b>${esc(g.n)}</b>${g.v>1?" · v"+g.v:""}<small>${G[g.g][0]} · ${g.y} · ${g.o=="v"?"вертикальная":"горизонтальная"}</small><div class="stars">${stars(g.sc/2)}<span class="dim" style="margin-left:6px">${(g.sc/2).toFixed(1)}</span></div><div style="margin-top:8px"><small>Ажиотаж ${Math.round(g.h||0)}%</small><div class="bar" style="margin-top:4px"><i style="width:${Math.min(100,g.h||0)}%"></i></div></div><div class="acts"><button class="btn o s" onclick="showRv(${g.id})">Отзывы</button><button class="btn s" ${S.dev?"disabled":""} onclick="startUpd(${g.id})">Обновить</button>${g.pl?`<button class="btn s" onclick="platform(${g.id})">Плейсы (${g.pl.p.filter(p=>p.me).length})</button>`:g.sc>=9?`<button class="btn s" ${S.money<PLC?"disabled":""} onclick="plUp(${g.id})">Платформа ${money(PLC)}</button>`:""}${PORTBTN(g)}<button class="rb gb" style="margin-left:auto" onclick="gameSet(${g.id})" aria-label="Настройки игры">${svg("gear",20)}</button></div>${!g.pl&&g.sc<9?`<small>Платформа плейсов откроется при пяти звёздах</small>`:""}</div><b style="color:var(--ok)">+${money(g.inc)}</b></div>`).join(""):`<p class="dim">Пока пусто. Нажми «Создать игру» на вкладке «Студия».</p>`}</div>`;
